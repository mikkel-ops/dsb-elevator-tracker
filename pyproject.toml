[project]
name = "dsb-elevator-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,sns]>=5",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
