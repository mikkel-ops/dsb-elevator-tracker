[project]
name = "elevator-tracker"
version = "0.2.0"
requires-python = ">=3.12"
# boto3 is provided by the Lambda runtime; it's here for local use and tests.
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
]

[dependency-groups]
dev = [
    "httpx2>=2.15",
    "moto[dynamodb,s3]>=5",
    "pytest>=8",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
